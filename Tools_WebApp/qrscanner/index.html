<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сканирование QR</title>

  <!-- Сначала подключаем библиотеку QR -->
  <script src="./html5-qrcode.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #reader {
      width: 90%;
      max-width: 400px;
    }
    #status {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div id="reader"></div>
  <div id="status">Наведи камеру на QR-код</div>

  <!-- Потом подключаем скрипт -->
  <script>
    window.onload = () => {
      let tg;

      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
      } else {
        console.warn("Не в Telegram WebApp — включён тестовый режим.");
        tg = {
          sendData: (d) => alert("Эмуляция sendData: " + d),
          close: () => alert("Эмуляция закрытия WebApp")
        };
      }

      if (typeof Html5Qrcode === "undefined") {
        document.getElementById("status").innerText = "QR-библиотека не загрузилась.";
        return;
      }

      const html5QrCode = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            (decodedText) => {
              document.getElementById("status").innerText = `Сканировано: ${decodedText}`;
              tg.sendData(decodedText);
              tg.close();
            },
            (errorMessage) => {
              console.warn(`Ошибка сканирования: ${errorMessage}`);
            }
          );
        } else {
          document.getElementById("status").innerText = "Камера не найдена.";
        }
      }).catch(err => {
        console.error("Ошибка при доступе к камере:", err);
        document.getElementById("status").innerText = "Ошибка доступа к камере.";
      });
    };
  </script>
</body>
</html>
